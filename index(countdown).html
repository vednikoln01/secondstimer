<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111225">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Seconds">
  <meta name="description" content="Set hours, minutes and seconds; watch a seconds-only countdown.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <title>Seconds — Countdown Timer</title>
  <!-- CSS: the colors, layout, and appearance -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header>
      <div class="brand">SECONDS<span>.</span></div>
      <button type="button" class="action thirtiary" id="countUP_DOWN">Countdown</button>
    </header>

    <section class="hero" aria-label="Countdown timer">
      <div class="dial" id="dial">
        <div class="dial-inside">
          <div id="display" class="number" role="timer" aria-live="off">60</div>
          <div class="seconds-label">Seconds left</div>
        </div>
      </div>
      <p class="status" id="status" role="status" aria-live="polite">Ready when you are</p>
    </section>

    <section class="controls" aria-label="Timer controls">
      <!-- HTML = WHAT IS ON THE SCREEN: three separate number boxes -->
      <p class="input-title" id="set-time-label">Set countdown duration</p>
      <div class="time-fields" role="group" aria-labelledby="set-time-label">
        <div class="time-field">
          <label class="field-label" for="hoursInput">Hours</label>
          <input id="hoursInput" type="number" inputmode="numeric" min="0" max="999" step="1" value="0">
        </div>
        <div class="time-field">
          <label class="field-label" for="minutesInput">Minutes</label>
          <input id="minutesInput" type="number" inputmode="numeric" min="0" max="59" step="1" value="1">
        </div>
        <div class="time-field">
          <label class="field-label" for="secondsInput">Seconds</label>
          <input id="secondsInput" type="number" inputmode="numeric" min="0" max="59" step="1" value="0">
        </div>
      </div>
      <div class="presets" aria-label="Quick durations">
        <button type="button" class="preset" data-seconds="30">30s</button>
        <button type="button" class="preset" data-seconds="60">1m</button>
        <button type="button" class="preset" data-seconds="300">5m</button>
        <button type="button" class="preset" data-seconds="900">15m</button>
        <button type="button" class="preset" data-seconds="1800">30m</button>
      </div>
      <div class="action-row">
        <button type="button" class="action primary" id="startPause">Start timer</button>
        <button type="button" class="action secondary" id="reset">Reset</button>
      </div>
      <p class="note">Runs in your browser · No account needed. Keep the app open for the most reliable completion sound.</p>
    </section>
  </main>
  <!-- JavaScript: the instructions that make the timer work -->
  <script src="./script.js" defer></script>
</body>
</html>
